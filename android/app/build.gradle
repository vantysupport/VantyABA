// App de Android de Vanty ABA: Trusted Web Activity que abre https://vanty.xyz a pantalla completa.
// Cada versión que subas a Google Play necesita un versionCode mayor que el anterior.

plugins {
    id 'com.android.application'
}

def host = 'vanty.xyz'

android {
    namespace 'xyz.vanty.app'
    compileSdk 36

    defaultConfig {
        applicationId 'xyz.vanty.app'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'

        manifestPlaceholders = [
            hostName  : host,
            defaultUrl: "https://${host}/login?app=android",
        ]
        resValue 'string', 'app_name', 'Vanty ABA'
        resValue 'string', 'launcher_name', 'Vanty ABA'
        resValue 'string', 'asset_statements',
            "[{\\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${host}\\\"}}]"
        resValue 'string', 'provider_authority', 'xyz.vanty.app.fileprovider'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        resValues true
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
